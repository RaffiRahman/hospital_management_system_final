
{% extends "navigationbar.html" %}
{% load static %}
{% block body %}

{% if error == "no" %}
<script>
    alert('Logged in Successfully');
    window.location = "{% url 'home' %}";
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert('Invalid Login Credential, Try Again');
</script>
{% endif %}

<style>
    .login-section {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 15px;
        background: linear-gradient(135deg, #f3f8ff, #e6f1ff);
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border-radius: 18px;
        padding: 40px 38px;
        box-shadow: 0 10px 35px rgba(24, 75, 130, 0.12);
        border: 1px solid #e8eff8;
    }

    .login-icon {
        width: 75px;
        height: 75px;
        background: #e8f2ff;
        color: #1769aa;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 32px;
    }

    .login-title {
        text-align: center;
        color: #173b63;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .login-subtitle {
        text-align: center;
        color: #7b8da5;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-label-custom {
        display: block;
        color: #344b65;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .login-input {
        width: 100%;
        height: 48px;
        border: 1px solid #dce5ef;
        border-radius: 9px;
        padding: 10px 14px;
        font-size: 14px;
        color: #344b65;
        outline: none;
        transition: all 0.3s ease;
        margin-bottom: 20px;
    }

    .login-input:focus {
        border-color: #2385d1;
        box-shadow: 0 0 0 3px rgba(35, 133, 209, 0.12);
    }

    .login-input::placeholder {
        color: #a5b1bf;
    }

    .login-btn {
        width: 100%;
        height: 49px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(135deg, #1769aa, #258bd2);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 5px;
    }

    .login-btn:hover {
        background: linear-gradient(135deg, #12558c, #1769aa);
        box-shadow: 0 6px 15px rgba(23, 105, 170, 0.25);
        transform: translateY(-2px);
    }

    .login-footer {
        text-align: center;
        color: #9aa8b8;
        font-size: 12px;
        margin-top: 25px;
        margin-bottom: 0;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 30px 22px;
        }

        .login-title {
            font-size: 24px;
        }
    }
</style>

<div class="login-section">
    <div class="login-card">

        <div class="login-icon">
            <i class="fa fa-user-md"></i>
        </div>

        <h2 class="login-title">Assistant Login</h2>

        <p class="login-subtitle">
            Welcome back! Please login to continue.
        </p>

        <form method="post">
            {% csrf_token %}

            <label class="form-label-custom">Assistant Name</label>
            <input
                type="text"
                class="login-input"
                name="uname"
                placeholder="Enter your assistant name"
                required
            >

            <label class="form-label-custom">Password</label>
            <input
                type="password"
                class="login-input"
                name="pwd"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-btn">
                <i class="fa fa-sign-in"></i>&nbsp; Login
            </button>
        </form>

        <p class="login-footer">
            Hospital Management System
        </p>

    </div>
</div>

{% endblock %}
